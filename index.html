<style>
/* 확정 틀(2026-10-17, 시안 E). 2026-10-18 한·영 두 벌(상단 전환, 원고는 app.en.json). 회사 소개 없음. 홈은 제품 브로셔 표지 7장을 세로로 쌓은 목차. 제품 쪽은 표지 → 펼침면(헤드라인+한 문단+화면) 교대 → 사양표 → 지원·개인정보 → 스토어 CTA. 제품마다 고유색이 표지와 강조색 */
:root{--bg:#ffffff;--bg2:#f4f5f8;--fg:#14161c;--muted:#636a7a;--rule:#e3e5eb;--ink:#ffffff;
 --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1115;--bg2:#171a20;--fg:#eef0f5;--muted:#9aa1b2;--rule:#282c36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--bg2:#171a20;--fg:#eef0f5;--muted:#9aa1b2;--rule:#282c36;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none} a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
img{max-width:100%;display:block} h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-0.02em} p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{font:400 .76rem var(--mono);color:var(--muted);padding-block:6px;border-bottom:1px solid var(--rule)}
.view{display:none}.view.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:14px;font:500 .8rem var(--mono);letter-spacing:.1em;color:var(--muted)}
.top .brand{display:flex;gap:8px;align-items:center;color:var(--fg)} .top .brand img{width:22px;height:22px}
.top .right{display:flex;gap:14px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--bg2)}
.lang button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:2px 10px;font:500 .74rem var(--sans);cursor:pointer;letter-spacing:0}
.lang button[aria-current]{background:var(--fg);color:var(--bg)}
/* 상단 배너 캐러셀 */
.carousel{position:relative;padding-block:6px 0}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:26px;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:no-preference){.track{scroll-behavior:smooth}}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start}
.cover{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;padding:36px 40px 36px 72px;min-height:340px;color:var(--ink);background:var(--tint);position:relative;overflow:hidden;height:100%}
@media (max-width:760px){.cover{padding-left:22px;padding-right:22px}}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:1.4rem;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:2}
.arrow.prev{left:14px}.arrow.next{right:14px}
@media (max-width:760px){.arrow{width:36px;height:36px;font-size:1.1rem}.arrow.prev{left:8px}.arrow.next{right:8px}}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:14px 6px;border-bottom:1px solid var(--rule)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px 5px 6px;font:500 .84rem var(--sans);cursor:pointer}
.tabs button img{width:24px;height:24px;border-radius:6px}
.tabs button[aria-current]{background:var(--bg2);color:var(--fg);border-color:var(--rule)}
.now{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--rule);font-size:.9rem}
.now img{width:28px;height:28px;border-radius:7px} .now b{font-weight:700} .now .sl{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now a{margin-left:auto;flex:none;font:500 .76rem var(--mono);color:var(--tint);border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.cover .more{font:500 .82rem var(--mono);letter-spacing:.06em;border:0;background:transparent;color:inherit;border-bottom:1px solid currentColor;padding:0 0 2px;cursor:pointer}
@media (max-width:760px){.cover{grid-template-columns:1fr;min-height:0}}
.cover .ic{display:flex;align-items:center;gap:12px;font:500 .78rem var(--mono);letter-spacing:.08em;opacity:.9} .cover .ic img{width:44px;height:44px;border-radius:11px}
.cover h2{font-size:clamp(2rem,5vw,3.6rem);font-weight:900;margin-top:14px;color:var(--ink)}
.cover h2.long{font-size:clamp(1.7rem,4.2vw,3.2rem)}  /* 14자 이상 긴 이름(영어)은 한 단계 작게 — 폭 800 에서 2줄로 감겨 배너 높이가 언어마다 달라지지 않도록 */
.cover .slogan{font-size:clamp(1.05rem,2vw,1.35rem);font-weight:500;margin-top:8px;opacity:.95}
.cover .line{margin-top:12px;max-width:44ch;opacity:.88}
.cover .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cover .vis{justify-self:end;align-self:end;display:flex;gap:10px;min-width:0;max-width:100%} .cover .vis img{max-height:300px;max-width:100%;width:auto;height:auto;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.35);transform:translateY(36px)}
@media (max-width:760px){.cover .vis{justify-self:center}.cover .vis img{max-height:220px;transform:translateY(26px)}}
.cover .big{font:900 clamp(3.6rem,11vw,8rem)/1 var(--sans);opacity:.14;position:absolute;right:28px;bottom:-14px;max-width:calc(100% - 56px);text-align:right;letter-spacing:-0.05em;pointer-events:none}  /* 2026-10-18 한 단계 줄임(16vw/11rem → 11vw/8rem). 긴 이름이 감기면 오른쪽에 붙는다 */
.badge{display:inline-flex;flex-direction:column;line-height:1.15;padding:9px 16px;border-radius:10px;background:var(--ink);color:#111;min-width:146px}
.badge small{font-size:.66rem;opacity:.7} .badge b{font-size:1rem;font-weight:700}
.badge.off{background:transparent;color:var(--ink);border:1px dashed rgba(255,255,255,.55)}
.badge.dark{background:var(--fg);color:var(--bg)} .badge.dark.off{background:transparent;color:var(--muted);border:1px dashed var(--rule)}
footer{padding-block:20px 48px;font:400 .78rem var(--mono);color:var(--muted);border-top:1px solid var(--rule);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 20px}
footer a{color:var(--muted)} footer a+a{margin-left:14px}
.email{display:inline-flex;gap:8px;align-items:center} .email button{font:inherit;font-size:.7rem;border:1px solid var(--rule);background:var(--bg2);color:var(--fg);border-radius:5px;padding:0 7px;cursor:pointer}
/* 브로셔 */
.back{display:inline-block;font:500 .78rem var(--mono);letter-spacing:.06em;color:var(--muted);padding-block:10px 14px}
.bcover{border-radius:30px;padding:48px 48px 0;color:var(--ink);background:var(--tint);display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:end;overflow:hidden;min-height:440px}
@media (max-width:760px){.bcover{grid-template-columns:1fr;padding:30px 24px 0;min-height:0}}
.bcover .txt{padding-bottom:48px} @media (max-width:760px){.bcover .txt{padding-bottom:26px}}
.bcover .ic{display:flex;align-items:center;gap:12px;font:500 .78rem var(--mono);letter-spacing:.08em;opacity:.9} .bcover .ic img{width:52px;height:52px;border-radius:13px}
.bcover h1{font-size:clamp(2.6rem,6.5vw,5rem);font-weight:900;margin-top:18px;color:var(--ink)}
.bcover .slogan{font-size:clamp(1.15rem,2.2vw,1.5rem);font-weight:500;margin-top:10px}
.bcover .line{margin-top:14px;max-width:44ch;opacity:.9;font-size:1.05rem}
.bcover .cta{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}
.bcover .vis{justify-self:center;display:flex;gap:12px;align-items:flex-end} .bcover .vis img{height:420px;width:auto;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media (max-width:760px){.bcover .vis img{height:300px}}
.bcover .vis img+img{height:360px;border-radius:22px 22px 0 0} @media (max-width:760px){.bcover .vis img+img{display:none}}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding-block:72px;border-bottom:1px solid var(--rule)}
@media (max-width:760px){.spread{grid-template-columns:1fr;gap:26px;padding-block:44px}}
.spread.flip .txt{order:2} @media (max-width:760px){.spread.flip .txt{order:0}}
.spread .eyebrow{font:500 .76rem var(--mono);letter-spacing:.1em;color:var(--tint);text-transform:uppercase}
.spread h2{font-size:clamp(1.7rem,3.4vw,2.6rem);font-weight:900;margin-top:10px}
.spread p{margin-top:16px;color:var(--muted);font-size:1.05rem;max-width:40ch}
.spread .vis{justify-self:center;min-width:0;max-width:100%} .spread .vis img{max-height:520px;max-width:100%;width:auto;height:auto;border-radius:26px;border:1px solid var(--rule);box-shadow:0 20px 50px rgba(0,0,0,.14)}
@media (max-width:760px){.spread .vis img{max-height:380px}}
.pts{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:6px;color:var(--fg);font-size:.95rem} .pts li{padding-left:18px;position:relative} .pts li::before{content:"";position:absolute;left:0;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--tint)}
.spread .panel{background:var(--bg2);border-radius:26px;padding:28px 30px;display:grid;gap:12px;width:100%;max-width:440px}
.spread .panel li{list-style:none;padding-left:18px;position:relative;color:var(--fg)} .spread .panel ul{margin:0;padding:0;display:grid;gap:8px}
.spread .panel li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:8px;border-radius:50%;background:var(--tint)}
.spread.solo{grid-template-columns:1fr} .spread.solo h2{max-width:20ch} .spread.solo p{max-width:60ch}
.spec{padding-block:64px;border-bottom:1px solid var(--rule)} .spec h2{font-size:1.6rem;font-weight:900;margin-bottom:22px}
.spec dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 28px;margin:0}
.spec dt{font:500 .72rem var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase} .spec dd{margin:2px 0 0;font-weight:500}
.disc{font-size:.88rem;color:var(--muted);max-width:68ch;margin:0;padding-block:28px 0}
.help{display:grid;grid-template-columns:1fr;gap:40px;padding-block:48px 56px;max-width:68ch}
@media (max-width:760px){.help{grid-template-columns:1fr;gap:28px}}
.help h2{font-size:1.3rem;font-weight:900;margin-bottom:12px}
details{border-top:1px solid var(--rule);padding:9px 0} details:last-of-type{border-bottom:1px solid var(--rule)} summary{cursor:pointer;font-weight:500} details p{color:var(--muted);margin-top:5px;font-size:.95rem}
.help .priv{color:var(--muted)} .help .priv b{color:var(--fg)}
.help a.link{color:var(--tint);font-weight:500}
.end{border-radius:30px;background:var(--tint);color:var(--ink);padding:48px;margin-block:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.end h2{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:900;color:var(--ink)} .end .cta{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.end{padding:28px 22px}}
.shotrow{display:flex;gap:12px;overflow-x:auto;padding-block:40px 0} .shotrow img{height:300px;width:auto;border-radius:18px;border:1px solid var(--rule);flex:none}
</style>

<script>
// 데이터는 tools/build.py가 apps/*/app.json(+app.en.json)에서 넣는다. 손으로 고치지 않는다.

ategory": "Lifestyle", "price": "Paid $0.99", "store": {"ios": {"name": "LoopSet"}}, "sections": [{"eyebrow": "Blocks", "title": "Built from blocks", "body": "Chain segments and repeat groups into one flow. Drop the rest from the final set and finish right away, and the total running time is recalculated as you edit. Undo and redo any change, one step at a time.", "points": []}, {"eyebrow": "Starting points", "title": "Made in a few taps", "body": "Tap create and pick a starting point: work and rest sets, Pomodoro, exam time. Fill in the set count and the times and the rest is assembled for you. Pick a bundled preset and it becomes yours to edit right away.", "points": []}, {"eyebrow": "Alerts", "title": "Never miss the moment a segment changes", "body": "Add a 3·2·1 countdown before each set, and attach a message to any segment so it appears the moment it starts. Set a reminder before the end, say 10 minutes left. Segment boundaries are notched into the progress bar, so you always know which one you are in.", "points": []}, {"eyebrow": "Sound", "title": "It follows your device's silent switch", "body": "When your phone is on silent, no sound plays and the timer screen tells you so. Choose sound, vibration, flash or silent for each preset, and alerts still arrive on schedule after you leave the app.", "points": []}], "faq": [{"q": "There's no sound", "a": "If your device is on silent (or vibrate), no sound plays. LoopSet always follows the device's silent setting. The run screen says “Your device is on silent, so no sound will play” when this is the case. A preset whose alert mode is Flash or Silent makes no sound either."}, {"q": "No alerts when I leave the app", "a": "Allow notifications when the app first asks. You can turn them on later under Settings → LoopSet → Notifications."}, {"q": "How do I get a refund?", "a": "Purchases are handled by the App Store. Request a refund through Apple's Report a Problem; the developer never receives your payment details."}], const UI={

(function(){const q=new URLSearchParams(location.search).get('lang'); const saved=store('lang');

function renderBody(a){

}
function route(){ const h=(location.hash||'').slice(1); let i=APPS.findIndex(a=>a.slug===h); if(i<0) i=0; if(i!==cur) show(i,true); }
renderHome(); bind(); addEventListener('hashchange',route); route();
